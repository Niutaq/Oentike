version: '3'

tasks:
  setup:
    desc: "Install missing dependencies (npm modules, homebrew packages)"
    cmds:
      - |
        export HOMEBREW_NO_AUTO_UPDATE=1
        if [ "$(uname -s)" = "Darwin" ]; then
          for pkg in ollama socat python@3.12; do
            if ! command -v $pkg >/dev/null 2>&1; then
              echo "Installing $pkg on macOS..."
              brew install $pkg
            fi
          done
        elif [ "$(uname -s)" = "Linux" ]; then
          for pkg in ollama socat python3.12; do
            if ! command -v $pkg >/dev/null 2>&1; then
              echo "Installing $pkg on Linux..."
              sudo apt-get update && sudo apt-get install -y $pkg || true
            fi
          done
        fi
      - |
        if ! command -v cargo >/dev/null 2>&1 && [ ! -f "$HOME/.cargo/bin/cargo" ]; then
          echo "Installing Rust via rustup..."
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        fi
      - |
        if [ ! -d "oentike-web/node_modules" ]; then
          echo "Installing web dependencies..."
          cd oentike-web && npm install
        fi

  nats:
    desc: "Launch NATS JetStream via Docker"
    cmds:
      - docker compose up -d nats

  server:
    desc: "Launch Go server (Control Plane) on port 50051"
    dir: oentike-control-plane
    cmds:
      - sleep 5 && go mod tidy && go run .

  ai:
    desc: "Run Python AI Orchestrator"
    dir: oentike-ai-orchestrator
    cmds:
      - bash -c "sleep 10 && if [ ! -d '.venv' ]; then python3.12 -m venv .venv; fi; source .venv/bin/activate && export PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 && pip install -r requirements.txt && python3.12 src/main.py"

  clean:
    desc: "Remove stale Tauri/Cargo build artifacts (run after moving the repo)"
    dir: oentike-web/src-tauri
    cmds:
      - cargo clean
      - rm -rf gen

  tauri-dev:
    internal: true
    desc: "Launch Tauri dev server only (no install/clean)"
    dir: oentike-web
    cmds:
      - npx tauri dev

  dev:
    desc: "Launch SOC desktop (npm install, NATS, Tauri). Use FRESH=1 to reset cache."
    cmds:
      - cd oentike-web && npm install
      - cd oentike-web && npx astro dev stop 2>/dev/null || true
      - |
        if [ "{{.FRESH}}" = "1" ]; then
          echo "FRESH=1 — clearing Tauri build cache..."
          task clean
        fi
      - task: nats
      - task: tauri-dev

  ollama:
    desc: "Run local Ollama server with qwen3-vl:4b"
    cmds:
      - |
        bash -c 'if curl -s http://127.0.0.1:11434/ >/dev/null; then
          echo "Ollama is already running."
        else
          nohup ollama serve > /dev/null 2>&1 &
          sleep 5
        fi
        ollama pull qwen3-vl:4b'

  envoy:
    desc: "Run Envoy Proxy with WASM filter via Docker"
    deps: [wasm]
    cmds:
      - sleep 12
      - docker rm -f oentike-envoy || true
      - docker run -u root --rm --name oentike-envoy -p 10000:10000 -p 9901:9901 -v ${PWD}/envoy.yaml:/etc/envoy/envoy.yaml -v ${PWD}/oentike-wasm-filter/target/wasm32-wasip1/release/oentike_wasm_filter.wasm:/etc/envoy/wasm/oentike_wasm_filter.wasm -v spire-sockets-vol:/tmp/spire-sockets --add-host host.docker.internal:host-gateway envoyproxy/envoy:v1.31-latest

  wasm:
    desc: "Compile Envoy WASM AI-Mesh filter (PII redaction)"
    dir: oentike-wasm-filter
    cmds:
      - export PATH="$HOME/.cargo/bin:$PATH" && rustup default stable && rustup target add wasm32-wasip1 && cargo build --target wasm32-wasip1 --release

  sensor:
    desc: "Run Test Edge Sensor"
    dir: test-client
    cmds:
      - sleep 15 && go run .

  start-all:
    desc: "Launch ALL components concurrently (NATS, Go, Python, Tauri, Ollama, Envoy, SPIRE)"
    deps: [setup]
    cmds:
      - echo "Starting all containers..."
      - task: run-all

  run-all:
    internal: true
    deps: [spire, wasm, server, ai, tauri-dev, ollama, envoy, sensor]

  spire:
    desc: "Start SPIRE server and agent via register_spire.sh"
    cmds:
      - ./register_spire.sh
