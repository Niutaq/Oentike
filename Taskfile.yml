version: '3'

tasks:
  oentike:up:
    desc: "Start the Oentike PostGIS database"
    silent: true
    cmds:
      - docker compose up -d --wait postgis

  oentike:migrate:
    desc: "Apply Oentike database migrations"
    silent: true
    deps: [oentike:up]
    dir: oentike-api
    cmds:
      - go run ./cmd/oentike-api migrate

  oentike:proto:
    desc: "Generate gRPC stubs for the conditions service"
    dir: oentike-api
    cmds:
      - go generate ./internal/conditions

  oentike:api:
    desc: "Run the Oentike API (HTTP health :8081, gRPC conditions :8082)"
    silent: true
    deps: [oentike:migrate]
    cmds:
      - task: oentike:serve

  oentike:serve:
    internal: true
    silent: true
    dir: oentike-api
    cmds:
      - |
        if curl --fail --silent --max-time 2 http://127.0.0.1:8081/readyz >/dev/null; then
          echo "Oentike API is already ready on http://127.0.0.1:8081"
        else
          go run ./cmd/oentike-api serve
        fi

  oentike:ingest:
    desc: "Fetch Open-Meteo for materialized cells (or CELL=id for one)"
    silent: true
    deps: [oentike:migrate]
    dir: oentike-api
    cmds:
      - |
        if [ -n "${CELL:-}" ]; then
          go run ./cmd/oentike-api ingest "$CELL"
        else
          go run ./cmd/oentike-api ingest
        fi

  oentike:sync-bdl:
    desc: "Pull BDL Nadleśnictwa (~429) into forest_units via WFS"
    silent: true
    deps: [oentike:migrate]
    dir: oentike-api
    cmds:
      - go run ./cmd/oentike-api sync-bdl

  oentike:test:
    desc: "Run Oentike API tests"
    silent: true
    dir: oentike-api
    cmds:
      - go test ./...

  oentike:down:
    desc: "Stop Oentike development containers"
    silent: true
    cmds:
      - docker compose stop postgis

  dev:
    desc: "Run the complete Oentike development system (backend and UI)"
    silent: true
    deps: [oentike:migrate]
    cmds:
      - task: oentike:run

  oentike:run:
    internal: true
    deps: [oentike:serve, oentike:dev-ui]

  default:
    desc: "Show available commands"
    cmds:
      - task --list

  doctor:
    desc: "Check local tools and Docker without installing anything"
    cmds:
      - sh scripts/doctor.sh

  field:
    desc: "Expedition journal: on macOS Astro + trusted .app (GPS + hot reload); elsewhere tauri dev"
    preconditions:
      - sh: test -x oentike-web/node_modules/.bin/tauri
        msg: "Run ./oentike setup first."
    cmds:
      - |
        if [ "$(uname -s)" = "Darwin" ]; then
          sh scripts/run-macos-desktop.sh src-tauri/tauri.field.conf.json
        else
          cd oentike-web && env -u npm_config_devdir npx tauri dev --config src-tauri/tauri.field.hot.conf.json
        fi

  field:hot:
    desc: "Expedition UI via naked tauri dev (fast Rust iteration; no Core Location prompt on macOS)"
    dir: oentike-web
    preconditions:
      - sh: test -x node_modules/.bin/tauri
        msg: "Run ./oentike setup first."
    cmds:
      - env -u npm_config_devdir npx tauri dev --config src-tauri/tauri.field.hot.conf.json

  setup:
    desc: "Check Tauri prerequisites and install locked web dependencies"
    cmds:
      - |
        if [ "$(uname -s)" = "Linux" ]; then
          if ! command -v pkg-config >/dev/null 2>&1 || ! pkg-config --exists javascriptcoregtk-4.1; then
            echo "ERROR: Missing Tauri Linux system dependencies (e.g. libwebkit2gtk-4.1-dev)."
            echo "Please run: sudo apt update && sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev"
            exit 1
          fi
        fi
      - |
        if ! command -v cargo >/dev/null 2>&1 && [ ! -f "$HOME/.cargo/bin/cargo" ]; then
          echo "Installing Rust via rustup..."
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        fi
      - cd oentike-web && env -u npm_config_devdir npm ci --no-audit --no-fund

  atlas:
    desc: "Validate atlas schema, references and SVG assets"
    dir: oentike-web
    cmds:
      - npm run atlas:check

  check:
    desc: "Run API tests, atlas validation, location plist contract and production UI build"
    cmds:
      - task: oentike:test
      - task: oentike:field-test
      - sh scripts/check-location-plist.sh
      - task: oentike:build

  oentike:field-test:
    desc: "Test expedition journal transactions, recovery and spatial calculations"
    dir: oentike-web
    cmds:
      - npm run test:field

  oentike:build:
    desc: "Validate atlas and build the UI"
    dir: oentike-web
    cmds:
      - npm run build

  bench:
    desc: "Measure spatial lookup and scoring on deterministic data"
    dir: oentike-api
    cmds:
      - go test ./internal/spatial ./internal/conditions -run '^$' -bench . -benchmem -count=3

  clean:
    desc: "Remove stale Tauri/Cargo build artifacts (run after moving the repo)"
    dir: oentike-web/src-tauri
    cmds:
      - cargo clean
      - rm -rf gen

  oentike:icons:
    internal: true
    silent: true
    dir: oentike-web
    cmds:
      - |
        if [ "src-tauri/app-icon.svg" -nt "src-tauri/icons/icon.icns" ]; then
          env -u npm_config_devdir node node_modules/@tauri-apps/cli/tauri.js icon src-tauri/app-icon.svg
          cp src-tauri/icons/icon.ico public/favicon.ico
          touch src-tauri/build.rs
        fi

  oentike:tauri:
    internal: true
    desc: "Launch desktop UI (macOS: Astro + trusted .app; elsewhere tauri dev)"
    silent: true
    cmds:
      - |
        if [ "$(uname -s)" = "Darwin" ]; then
          sh scripts/run-macos-desktop.sh src-tauri/tauri.dev.bundle.conf.json
        else
          cd oentike-web && env -u npm_config_devdir npx tauri dev
        fi

  oentike:ui:
    desc: "Launch the Oentike desktop UI. Use FRESH=1 to reset cache."
    silent: true
    preconditions:
      - sh: test -x oentike-web/node_modules/.bin/astro
        msg: "Run ./oentike setup to install UI dependencies first."
    cmds:
      - cd oentike-web && env -u npm_config_devdir npx astro dev stop >/dev/null 2>&1 || true
      - |
        if [ "{{.FRESH}}" = "1" ]; then
          echo "FRESH=1 - clearing Tauri build cache..."
          task clean
        fi
      - task: oentike:icons
      - task: oentike:tauri

  oentike:dev-ui:
    internal: true
    silent: true
    cmds:
      - |
        deadline=$(( $(date +%s) + 120 ))
        until curl --fail --silent --max-time 2 http://127.0.0.1:8081/readyz >/dev/null; do
          if [ "$(date +%s)" -ge "$deadline" ]; then
            echo "Oentike API did not become ready within 120 seconds (including Go compilation)." >&2
            exit 1
          fi
          sleep 0.25
        done
      - task: oentike:ui
        vars:
          FRESH: "{{.FRESH}}"
