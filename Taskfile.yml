version: '3'

tasks:
  nats:
    desc: "Launch NATS server with JetStream and WebSockets"
    cmds:
      - 'nix-shell -p nats-server --run "echo \"websocket { port: 9222, no_tls: true }\" > nats.conf && nats-server -js -c nats.conf"'

  server:
    desc: "Launch Go server (Control Plane) on port 50051"
    dir: oentike-control-plane
    cmds:
      - sleep 2 && go run .

  ai:
    desc: "Run Python AI Orchestrator"
    dir: oentike-ai-orchestrator
    cmds:
      - nix-shell -p python3 --run 'bash -c "sleep 5 && if [ ! -d '\''.venv'\'' ]; then python3 -m venv .venv; fi; source .venv/bin/activate && pip install -r requirements.txt && python3 src/main.py"'

  web:
    desc: "Run Astro Web Dashboard"
    dir: oentike-web
    cmds:
      - npm run dev

  ollama:
    desc: "Run local Ollama server with qwen3-vl:4b"
    cmds:
      - nix shell github:NixOS/nixpkgs/nixpkgs-unstable#ollama -c bash -c 'OLLAMA_HOST=127.0.0.1:11434 ollama serve & sleep 5 && ollama pull qwen3-vl:4b && wait'

  envoy:
    desc: "Run Envoy Proxy with WASM filter via Docker"
    deps: [wasm]
    cmds:
      - sleep 12
      - sudo docker rm -f zt-fingate-envoy || true
      - sudo docker run -u root --rm --name zt-fingate-envoy -p 10000:10000 -p 9901:9901 -v ${PWD}/envoy.yaml:/etc/envoy/envoy.yaml -v ${PWD}/oentike-wasm-filter/target/wasm32-wasip1/release/oentike_wasm_filter.wasm:/etc/envoy/wasm/oentike_wasm_filter.wasm -v ${PWD}/spire/sockets:/tmp/spire-sockets --add-host host.docker.internal:host-gateway envoyproxy/envoy:v1.31-latest

  wasm:
    desc: "Compile WASM FinOps Tollbooth filter"
    dir: oentike-wasm-filter
    cmds:
      - nix-shell -p rustup cargo rustc --run "rustup default stable && rustup target add wasm32-wasip1 && cargo build --target wasm32-wasip1 --release"

  agent:
    desc: "Compile and run Rust agent with UI (Edge Agent)"
    dir: oentike-edge-agent
    cmds:
      - sleep 12
      - nix-shell --run "cargo run"

  start-all:
    desc: "Launch ALL components concurrently (NATS, Go, Python, Astro, Rust, Ollama, Envoy, SPIRE)"
    cmds:
      - echo "Requesting sudo password upfront for Docker containers..."
      - sudo -v
      - task: run-all

  run-all:
    internal: true
    deps: [spire, nats, wasm, server, ai, web, agent, ollama, envoy]

  spire:
    desc: "Start SPIRE server and agent via register_spire.sh"
    cmds:
      - ./register_spire.sh
