syntax = "proto3";

package oentike.fingate;

option go_package = "oentike-control-plane/api/v1";

message ClientMetrics {
    int64 mtls_setup_ms = 1;
    int32 payload_bytes = 2;
    string region = 3;
}

message TelemetryRequest {
    string agent_id = 1;
    float cpu_usage_percent = 2;
    int32 memory_used_mb = 3;
    ClientMetrics metrics = 4;
}

message TelemetryResponse {
    string status = 1; 
}

service FingateService {
    rpc StreamTelemetry(stream TelemetryRequest) returns (TelemetryResponse);
}
